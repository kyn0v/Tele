name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require npm with trusted publishing support
        run: |
          version=$(npm --version)
          if ! node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); process.exit(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1) ? 0 : 1)' "$version"; then
            npm install --global npm@11 --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:ci
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
